---

- name: Install helpful utilities
  apt:
    name:
      - bison
      - cloc
      - flex
      - kdiff3
      - nmap
      # - xvfb <- only used for ancient selenium testing

- name: 'Install my Git scripts'
  copy:
    src:  "bin/{{ item }}"
    dest: "{{ ansible_user_dir }}/bin/"
    mode: '755'
  with_items:
    - log-to-last-merge
    - prune-merged-branches
    - rebase-to-last-merge

- name: Install Git
  apt:
    state: present
    name:
      - git
      - git-lfs

- name: Install Ansible
  apt:
    state: present
    name:
      - ansible
      - ansible-lint

# - name: Install Git related tools
#   apt:
#     name:
#       - giggle
#       - git
#       - git-cola
#       - gitg

- name: Install Graphviz
  apt: name=graphviz state=present

- name: Install common build utils
  apt:
    name:
      - autoconf
      - automake
      - build-essential
      - cmake
      - kcachegrind
      - make

- name: LibVirt and related
  apt:
    state: present
    name:
      - libvirt-clients
      - libvirt-dev
      - qemu-utils
      - virt-manager

