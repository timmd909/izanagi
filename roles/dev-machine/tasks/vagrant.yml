- name: "Add Hashicorp keys"
  shell: >
    curl -fsSL https://apt.releases.hashicorp.com/gpg |
    gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

- name: Add Hashicorp sources (Ubuntu 24.04)
  template:
    src: etc/apt/sources.list.d/hashicorp.list.j2
    dest: /etc/apt/sources.list.d/hashicorp.list
  when: >
    ansible_architecture == "x86_64" and
    ansible_distribution == "Ubuntu" and
    ansible_distribution_version == "24.04"
  vars:
    vagrant_release: noble

- name: Add Hashicorp sources (Devuan)
  template:
    src: etc/apt/sources.list.d/hashicorp.list.j2
    dest: /etc/apt/sources.list.d/hashicorp.list
  when: >
    ansible_architecture == "x86_64" and
    ansible_distribution == "Devuan" and
    ansible_distribution_version == "6"
  vars:
    # note: hashicorp doesn't have a recent version of this software,
    # so we go w/ the previous version.
    vagrant_release: bookworm

- name: Update APT cache
  apt: update_cache=true

- name: Install Vagrant
  apt:
    state: present
    name: vagrant

- name: Enable libvirt Vagrant plugin (root)
  shell: vagrant plugin install vagrant-libvirt

- name: Enable libvirt Vagrant plugin (user)
  shell: vagrant plugin install vagrant-libvirt
  become: true
  become_user: "{{ ansible_user_id }}"
