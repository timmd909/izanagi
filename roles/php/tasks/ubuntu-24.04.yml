---
#
# WARNING! THIS INSTALLS AN ANCIENT VERSION OF PHP!
#

- name: 'Install up-to-date PHP PPA'
  shell: add-apt-repository -y ppa:ondrej/php

# - name: Download latest Composer
#   get_url:
#     # if checksum ever breaks, find out the new one at:
#     # curl -sS https://composer.github.io/installer.sig
#     checksum: sha384:55ce33d7678c5a611085589f1f3ddf8b3c52d662cd01d4ba75c0ee0459970c2200a51f492d557530c71c15d8dba01eae
#     url: 'https://getcomposer.org/installer'
#     dest: '/tmp/composer-setup.php'

# - name: Install Composer
#   shell: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer

- name: Install PHP and libraries
  apt:
    update_cache: true
    name:
      - php8.5
      - composer
      - php8.5-bcmath
      - php8.5-curl
      - php8.5-gd
      - php8.5-imagick
      - php8.5-intl
      - php8.5-mbstring
      - php8.5-mysql
      # - php8.5-opcache <- should already be a part of PHP... double check that it's enabled
      - php8.5-pcov
      - php8.5-xml
      - php8.5-zip
    state: present

- name: Ensure old PHP versions are removed
  apt:
    state: absent
    name:
      - php8.4
      - php8.4-bcmath
      - php8.4-curl
      - php8.4-gd
      - php8.4-imagick
      - php8.4-intl
      - php8.4-mbstring
      - php8.4-mysql
      - php8.4-opcache
      - php8.4-pcov
      - php8.4-xml
      - php8.4-zip
