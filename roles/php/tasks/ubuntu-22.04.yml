---
#
# WARNING! THIS INSTALLS AN ANCIENT VERSION OF PHP!
#

- name: memcache
  apt: name=memcached state=present

- name: Install ppa:ondrej PHP PPA'
  shell: add-apt-repository -y ppa:ondrej/php

- name: Download latest Composer
  get_url:
    # if checksum ever breaks, find out the new one at:
    # curl -sS https://composer.github.io/installer.sig
    checksum: sha384:c8b085408188070d5f52bcfe4ecfbee5f727afa458b2573b8eaaf77b3419b0bf2768dc67c86944da1544f06fa544fd47
    url: 'https://getcomposer.org/installer'
    dest: '/tmp/composer-setup.php'

- name: Install Composer
  shell: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
  args:
    creates: /usr/local/bin/composer

- name: Remove Composer installer
  file:
    path: /tmp/composer-setup.php
    state: absent

- name: Install PHP and libraries
  apt:
    name:
      - php7.4
      - php7.4-bcmath
      - php7.4-curl
      - php7.4-gd
      - php7.4-imagick
      - php7.4-mysql
      - php7.4-xml
      - php7.4-zip
    state: present

- name: 'Set default PHP version'
  alternatives:
    name: php
    priority: -10
    path: /usr/bin/php7.4

- name: Enable PHP mods
  shell: "phpenmod -v 7.4 {{ item }}"
  with_items:
    - amqplib
    - bcmath
    - curl
    - dom
    - mbstring
    - mcrypt
    - phar
    - xml
    - zip
