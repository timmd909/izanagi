- name: Install more wallpapers (Ubuntu >= 24.04)
  apt:
    name:
      - ubuntustudio-wallpapers-jammy
      - ubuntustudio-wallpapers-kinetic
      - ubuntustudio-wallpapers-lunar
      - ubuntustudio-wallpapers-mantic
      - ubuntustudio-wallpapers-noble
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_version == "24.04"

- name: Install GTK themes (All)
  apt:
    name:
      - numix-gtk-theme
      - numix-icon-theme
      - numix-icon-theme-circle
