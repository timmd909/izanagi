#
# CINNAMON PREFERENCES
#
# Big thanks to https://superuser.com/questions/1006983/how-to-set-cinnamon-preferences-in-command-line
#

- name: Change modifier key to Super instead of Alt
  dconf:
    key: /org/cinnamon/desktop/wm/preferences/mouse-button-modifier
    value: "'<Super>'"

# - name: Disable weird touchpad scrolling
#   dconf:
#     key: /org/cinnamon/settings-daemon/peripherals/touchpad/natural-scroll
#     value: false

- name: Disable tap to click w/ touchpad (Ubuntu)
  dconf:
    key: /org/cinnamon/settings-daemon/peripherals/touchpad/tap-to-click
    value: false
  when: ansible_distribution == 'Ubuntu'

- name: Disable tap to click w/ touchpad (Devuan)
  dconf:
    key: /org/cinnamon/desktop/peripherals/touchpad/tap-to-click
    value: false
  when: ansible_distribution == 'Devuan'

- name: Change background (Ubuntu 24.04)
  dconf:
    key: /org/cinnamon/desktop/background/picture-uri
    value: "{{ cinnamon_wallpaper }}"

- name: Configure Cinnamon
  dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  with_items: "{{ cinnamon_settings }}"

- name: Configure Nemo
  dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  with_items: "{{ nemo_settings }}"

- name: Add Nemo bookmarks
  lineinfile:
    path: ~/.config/gtk-3.0/bookmarks
    line: "{{ item.url }} {{ item.label }}"
    state: present
    create: yes
  with_items: "{{ nemo_bookmarks }}"
