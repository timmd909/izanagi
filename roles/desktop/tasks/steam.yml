- name: Install Steam keys
  get_url:
    url: https://repo.steampowered.com/steam/archive/stable/steam.gpg
    dest: /usr/share/keyrings/steam.gpg

- name: Install Steam APT sources
  template:
    src: etc/apt/sources.list.d/steam-stable.list.j2
    dest: /etc/apt/sources.list.d/steam-stable.list

- name: Install Steam APT sources (Beta)
  template:
    src: etc/apt/sources.list.d/steam-beta.list.j2
    dest: /etc/apt/sources.list.d/steam-beta.list

# Note: do this with a lineinfile of /var/lib/dpkg/arch ?
- name: Add i386 architecture for Steam library dependencies
  ansible.builtin.command: dpkg --add-architecture i386
  register: dpkg_arch_result
  changed_when: dpkg_arch_result.rc == 0
  failed_when: dpkg_arch_result.rc > 1

- name: Install Steam Launcher
  apt:
    update_cache: true
    state: present
    name:
      - steam-launcher
      - steam-libs-amd64
      - steam-libs-i386

- name: Add steam dependencies
  apt:
    state: present
    name:
      - libc6:amd64
      - libc6:i386
      - libegl1:amd64
      - libegl1:i386
      - libgbm1:amd64
      - libgbm1:i386
      - libgl1-mesa-dri:amd64
      - libgl1-mesa-dri:i386
      - libgl1:amd64
      - libgl1:i386

- name: Add jstest-gtk
  apt:
    state: present
    name: jstest-gtk
