- name: Ensure repositories directory exists
  file:
    state: directory
    create: true
    owner: borg
    group: borg
    path: "{{ borg_repo_dir }}"

- name: Create borg group
  group:
    name: borg
    state: present

- name: Create borg user
  user:
    name: borg
    create_home: true
    home: "/home/borg"

- name: Create repo users
  user:
    name: "{{ item.host }}"
    create_home: true
    home: "/home/{{ item.host }}"
    append: true
    groups: borg
  loop: "{{ borg_clients }}"

- name: "Verify .ssh directory exists"
  file:
    path: "/home/{{ item.host }}/.ssh"
    mode: '0700'
    state: directory
    owner: '{{ item.host }}'
    group: '{{ item.host }}'
  loop: "{{ borg_clients }}"

- name: "Add pubkeys to repo users' authorized keys "
  lineinfile:
    path: "/home/{{ item.host }}/.ssh/authorized_keys"
    create: true
    state: present
    line: "{{ item.pubkey }}"
    owner: '{{ item.host }}'
    group: '{{ item.host }}'
  loop: "{{ borg_clients }}"

- name: "Verify users' repository directories exist"
  file:
    path: "/{{ borg_repo_dir }}/{{ item.host }}"
    state: directory
    owner: '{{ item.host }}'
    group: '{{ item.host }}'
  loop: "{{ borg_clients }}"

